name: Build Docs — NeonJulia

on:
  push:
    branches: [ main ]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Build documentation
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate(); include("docs/make.jl")'
`
